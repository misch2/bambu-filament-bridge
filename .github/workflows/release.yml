name: Release images
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Require stable or experimental semver tag on default branch
        env:
          TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-experimental)?$ ]]
          git fetch origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          echo "IMAGE=ghcr.io/${OWNER,,}/bambu-filament-bridge" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - name: Require packaging versions to match tag
        run: |
          grep -F "VERSION ${VERSION%%-*} LANGUAGES" CMakeLists.txt
          grep -F "set(BFB_VERSION \"$VERSION\")" CMakeLists.txt
          grep -F "version: \"$VERSION\"" home-assistant/bambu_filament_bridge/config.yaml
          grep -F "io.hass.version=\"$VERSION\"" Dockerfile
          grep -F "version=$VERSION backend=" src/main.cpp
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=${{ !contains(env.VERSION, '-') }}
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(env.VERSION, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
